# /etc/nginx/sites-available/memgraph
#
# Memgraph Lab Reverse Proxy mit Basic Authentication
# CORS enabled for /health and /gardener/
#

# HTTP -> HTTPS Redirect
server {
    listen 80;
    server_name geargraph.gearshack.app;

    return 301 https://$server_name$request_uri;
}

# HTTPS Server
server {
    listen 443 ssl http2;
    server_name geargraph.gearshack.app;

    # SSL-Zertifikate
    ssl_certificate /etc/letsencrypt/live/geargraph.gearshack.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geargraph.gearshack.app/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 4h;

    # Basic Authentication
    auth_basic "Memgraph Lab - Login Required";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Memgraph Lab (Web-UI)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für lange Queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Health-Check Endpoint (ohne Auth, mit CORS)
    # Proxied to gardener API for CORS header support (return statement ignores add_header)
    location = /health {
        auth_basic off;
        
        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Content-Type' 'text/plain' always;
            return 204;
        }
        
        # Proxy to gardener status for health check (supports add_header)
        proxy_pass http://127.0.0.1:3001/api/system/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # Stats Endpoint (ohne Auth, mit CORS)
    location = /stats {
        auth_basic off;
        
        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            return 204;
        }
        
        # Proxy to gardener stats
        proxy_pass http://127.0.0.1:3001/api/system/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # MCP-Server ist unter /mcp/ erreichbar (ohne Auth!)
    location /mcp/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8000/mcp/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Wichtig für WebSocket
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Price Discovery API — routed to Graph Gardener (port 3001)
    # Must appear BEFORE the generic /api/ block (nginx: most specific wins)
    location ~ ^/api/price-discovery(/.*)?$ {
        auth_basic off;

        if ($request_method = OPTIONS) {
            add_header "Access-Control-Allow-Origin" "*" always;
            add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS" always;
            add_header "Access-Control-Allow-Headers" "Content-Type, Authorization" always;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        add_header "Access-Control-Allow-Origin" "*" always;
        add_header "Access-Control-Allow-Methods" "GET, POST, OPTIONS" always;
        add_header "Access-Control-Allow-Headers" "Content-Type, Authorization" always;
    }

    # GearGraph GraphQL API (ohne Basic Auth, mit API-Key)
    location /api/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts für komplexe Queries
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # ========================================================================
    # GRAPH GARDENER API
    # ========================================================================
    # Autonomous Graph Maintenance System
    # Erreichbar unter: https://geargraph.gearshack.app/gardener/
    # ========================================================================

    # Graph Gardener API (CORS enabled, no Basic Auth)
    location /gardener/ {
        auth_basic off;

        # Handle CORS preflight
        if ($request_method = OPTIONS) {
            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
            add_header 'Access-Control-Max-Age' 86400 always;
            return 204;
        }

        proxy_pass http://127.0.0.1:3001/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket Support for streaming
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer Settings
        proxy_buffering off;
        
        # CORS headers for all responses
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
    }

    # Graph Gardener Health Check (ohne Auth)
    location = /gardener/api/system/status {
        auth_basic off;
        proxy_pass http://127.0.0.1:3001/api/system/status;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        
        # CORS headers
        add_header 'Access-Control-Allow-Origin' '*' always;
        add_header 'Access-Control-Allow-Methods' 'GET, OPTIONS' always;
    }

    # ========================================================================
    # FIRECRAWL WEB SCRAPING API
    # ========================================================================
    # Erreichbar unter: https://geargraph.gearshack.app/firecrawl/
    # Authentication: Bearer Token (im Authorization Header)
    # ========================================================================

    # Firecrawl API (ohne Basic Auth, mit Bearer Token)
    location /firecrawl/ {
        auth_basic off;  # Keine Basic Auth, Firecrawl nutzt Bearer Token

        # Rate Limiting (30 requests/minute)
        limit_req zone=firecrawl_limit burst=10 nodelay;

        proxy_pass http://127.0.0.1:3002/;
        proxy_http_version 1.1;

        # Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts (Firecrawl kann lange dauern bei Crawls)
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;

        # WebSocket Support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Buffer Settings für große Responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Firecrawl Health Check (ohne Rate Limit & Auth)
    location /firecrawl/health {
        auth_basic off;
        proxy_pass http://127.0.0.1:3002/health;
        access_log off;
    }

    # Firecrawl Admin UI (mit Basic Auth schützen!)
    location /firecrawl/admin {
        # Basic Auth für Admin UI (nutzt dieselbe .htpasswd wie Memgraph Lab)
        auth_basic "Firecrawl Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;

        proxy_pass http://127.0.0.1:3002/admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
