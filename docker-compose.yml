# Gardener-only stack.
#
# Memgraph is NOT defined here — it runs as part of the separate
# `memgraph-platform` stack on this host (alongside memgraph-lab and
# mcp-memgraph). We attach the gardener container to that stack's network
# (`memgraph-platform_memgraph-net`) as an `external` network so the
# `bolt://memgraph:7687` hostname resolves consistently after every rebuild.
#
# Why this matters: a previous compose definition spun up its own memgraph
# service that was never used (the external one was already in production).
# Every time the gardener was rebuilt with `docker compose up -d --no-deps
# --build gardener`, it landed on its own bridge network and lost DNS for
# `memgraph`, requiring a manual `docker network connect`. Declaring the
# external network here makes that connection part of the spec.

services:
  gardener:
    build: ./gardener
    env_file: .env
    container_name: graph-gardener
    ports:
      - "3001:4111"
    environment:
      # MEMGRAPH_URI / MEMGRAPH_USER / MEMGRAPH_PASSWORD: read from .env via env_file.
      # Do NOT hardcode them here — the explicit `environment:` block overrides
      # env_file values, and that masked an auth-mismatch with the live
      # memgraph-platform stack (correct password lives in .env).
      - NODE_ENV=production
      - PORT=4111
    networks:
      - default
      - memgraph-net
    restart: unless-stopped

networks:
  default:
  memgraph-net:
    name: memgraph-platform_memgraph-net
    external: true
