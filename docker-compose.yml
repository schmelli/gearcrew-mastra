version: '3.8'

services:
  memgraph:
    image: memgraph/memgraph-mage:latest
    container_name: geargraph-memgraph
    ports:
      - "7687:7687"
      - "7444:7444"
    volumes:
      - memgraph_data:/var/lib/memgraph
    environment:
      - MEMGRAPH_USER=memgraph
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7687"]
      interval: 10s
      timeout: 5s
      retries: 5

  gardener:
    build: ./gardener
    env_file: .env
    container_name: graph-gardener
    ports:
      - "3001:4111"
    environment:
      - MEMGRAPH_URI=bolt://memgraph:7687
      - MEMGRAPH_USER=memgraph
      - MEMGRAPH_PASSWORD=
      - NODE_ENV=production
      - PORT=4111
    depends_on:
      memgraph:
        condition: service_healthy
    restart: unless-stopped

volumes:
  memgraph_data:
